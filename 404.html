<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — emTesseract</title>
  <link rel="icon" type="image/png" href="logo.png" sizes="any">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
    .error-page h1 { color: var(--cyan); font: 600 7rem/1 var(--font-display); letter-spacing: -.08em; margin: 0 0 24px; }
    .error-page p { color: var(--muted); margin: 0 0 28px; }
    .error-page a { color: var(--cyan); text-decoration: none; font: 500 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .08em; }
    .error-page a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="error-page">
    <h1>404</h1>
    <p>This page doesn't exist. Maybe it got lost in the dungeon?</p>
    <a href="/">← Back to emTesseract</a>
  </div>
</body>
</html>
